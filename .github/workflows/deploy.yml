name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inject the ElevenLabs key (optional). Add a repo secret named EL_KEY
      # under Settings -> Secrets and variables -> Actions. If the secret is
      # missing this writes an empty key and voice features stay off.
      - name: Inject voice API key
        run: |
          cat > voice-config.js <<'EOF'
          /* AUTO-GENERATED AT DEPLOY TIME — do not edit, do not commit a real key. */
          const VOICE_CONFIG = {
            enabled: false,
            apiKey: "__EL_KEY__",
            voiceId: "21m00Tcm4TlvDq8ikWAM"
          };
          EOF
          sed -i "s|__EL_KEY__|${{ secrets.EL_KEY }}|" voice-config.js
          if [ -n "${{ secrets.EL_KEY }}" ]; then
            sed -i 's|enabled: false|enabled: true|' voice-config.js
          fi

      # ------------------------------------------------------------------
      # AUTOMATIC CACHE BUSTING
      # Browsers cache styles.css / *.js by URL. A hand-edited "?v=2" only
      # works if somebody remembers to bump it, and somebody never does --
      # that is exactly how a phone ends up running last week's code on
      # game night. Stamp every asset URL with the commit SHA instead, so
      # any deploy that changes a file also changes its URL. Nothing to
      # remember, nothing to bump.
      # ------------------------------------------------------------------
      - name: Stamp asset URLs with the commit SHA
        run: |
          STAMP="${GITHUB_SHA:0:12}"
          for f in *.html; do
            sed -i -E "s/\.(css|js)\?v=[A-Za-z0-9._-]+/.\1?v=$STAMP/g" "$f"
          done
          echo "Stamped asset URLs with v=$STAMP"
          grep -o 'v=[A-Za-z0-9]*' index.html | sort -u

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
