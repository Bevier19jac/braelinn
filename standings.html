<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ===================================================================
     PUBLIC IDENTITY
     Every page shares ONE title, description and share image on purpose.
     Link scrapers (iMessage, WhatsApp, Slack) don't run JavaScript and
     read only these static tags — so whichever page gets shared, the
     preview says "Braelinn Poker League", never "Schedule — ...".
     =================================================================== -->
<title>Braelinn Poker League</title>
<meta name="description" content="Season standings, RSVP, schedule, seat draw, and game-night hub for the Braelinn Poker League.">
<link rel="canonical" href="https://bevier19jac.github.io/braelinn/">

<meta property="og:site_name" content="Braelinn Poker League">
<meta property="og:type" content="website">
<meta property="og:title" content="Braelinn Poker League">
<meta property="og:description" content="Season standings, RSVP, schedule, seat draw, and game-night hub for the Braelinn Poker League.">
<meta property="og:url" content="https://bevier19jac.github.io/braelinn/">
<meta property="og:image" content="https://bevier19jac.github.io/braelinn/social-card.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Braelinn Poker League — Season 7, Peachtree City GA">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Braelinn Poker League">
<meta name="twitter:description" content="Season standings, RSVP, schedule, seat draw, and game-night hub for the Braelinn Poker League.">
<meta name="twitter:image" content="https://bevier19jac.github.io/braelinn/social-card.png?v=2">

<!-- ===================================================================
     INSTALLED-APP BEHAVIOUR
     apple-touch-icon is what stops iOS screenshotting the page and using
     that as the home-screen icon. apple-mobile-web-app-title stops iOS
     labelling the icon from <title>.
     =================================================================== -->
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#06120d">
<meta name="color-scheme" content="dark">

<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Braelinn Poker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div id="nav"></div>

<div class="wrap">
  <header class="hero" style="padding-bottom:20px">
    <p class="hero-eyebrow" id="eyebrow">Season 7</p>
    <h1>The Chase</h1>
    <p class="hero-sub" id="sub"></p>
  </header>

  <section id="statSec">
    <div class="stat-row">
      <div class="stat"><span class="n" id="sGames">0</span><span class="l">Games Played</span></div>
      <div class="stat"><span class="n" id="sPlayers">0</span><span class="l">Have Played</span></div>
      <div class="stat"><span class="n" id="sLeader">—</span><span class="l">Out Front</span></div>
    </div>
  </section>

  <!-- Before the first game there is nothing to rank. Showing 34 rows of
       zeroes is worse than showing nothing, so show the season instead. -->
  <section id="preSec" hidden>
    <div class="card preseason">
      <div class="ps-suits" aria-hidden="true">
        <span class="b">♠</span><span class="r">♥</span><span class="r">♦</span><span class="b">♣</span>
      </div>
      <h3 id="psTitle">Season 7 starts here</h3>
      <p id="psBody"></p>
      <div class="ps-meta" id="psMeta"></div>
    </div>
  </section>

  <section id="tableSec">
    <div class="sec-head">
      <h2>Season <span id="seasonNo"></span></h2>
      <span class="hint"><button class="btn btn-sm" id="btnToggle">Show everyone</button></span>
    </div>
    <div class="card" style="padding:6px 10px">
      <div class="tbl-scroll">
        <table class="tbl">
          <thead>
            <tr>
              <th>#</th><th>Player</th>
              <th data-sort="points">Pts</th>
              <th data-sort="events">G</th>
              <th data-sort="wins">W</th>
              <th data-sort="cashes">ITM</th>
              <th data-sort="avgPlace">Avg</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <p class="tiny muted mt" id="pointsNote"></p>
  </section>

  <section id="gamesSec" hidden>
    <div class="sec-head"><h2>Every Game</h2><span class="hint" id="gamesHint"></span></div>
    <div id="gamesList"></div>
  </section>

</div>

<div id="footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=3"></script>
<script src="data.js?v=3"></script>
<script src="app-core.js?v=3"></script>
<script src="fx.js?v=3"></script>
<script>
(function () {
  "use strict";
  UI.mount("standings.html");

  document.getElementById("eyebrow").textContent = "Season " + LEAGUE.season;
  document.getElementById("seasonNo").textContent = LEAGUE.season;
  document.getElementById("pointsNote").textContent =
    LEAGUE.points.describe + " G = games played, ITM = in the money, Avg = average finish. " +
    "Every number comes from finalized games. Ties are broken by wins, then ITM " +
    "finishes, then average finish — players level on all of those are shown as tied (T).";

  let sortKey = "points", showAll = false, agg = null;

  function render() {
    if (!agg) return;

    document.getElementById("sGames").textContent = agg.gamesPlayed;
    document.getElementById("sPlayers").textContent = agg.players.filter(p => p.events).length;

    const hasGames = agg.gamesPlayed > 0;
    document.getElementById("sub").textContent = hasGames
      ? agg.gamesPlayed + (agg.gamesPlayed === 1 ? " game" : " games") + " in the books."
      : "Season " + LEAGUE.season + " hasn't started. Nothing to rank yet.";
    document.getElementById("gamesSec").hidden = !hasGames;
    document.getElementById("tableSec").hidden = !hasGames;
    document.getElementById("preSec").hidden   = hasGames;
    document.getElementById("statSec").hidden  = !hasGames;

    if (!hasGames) {
      const g = BPL.currentGame();
      const field = LEAGUE.standings.length;
      document.getElementById("psTitle").textContent =
        "Season " + LEAGUE.season + " starts here";
      document.getElementById("psBody").textContent =
        "No cards have been dealt yet, so there is nothing to rank. " +
        "The table fills in the moment the first game is finalized.";
      const bits = [];
      if (g) bits.push("First game <b>" + UI.esc(BPL.fmtShort(g.date)) + "</b>");
      bits.push("<b>" + LEAGUE.schedule.length + "</b> events scheduled");
      bits.push("<b>" + field + "</b> on the roster");
      bits.push("<b>" + BPL.money(LEAGUE.nextGame.buyin) + "</b> a seat");
      document.getElementById("psMeta").innerHTML =
        bits.map(b => "<span>" + b + "</span>").join("");
      return;
    }

    let rows = agg.players.slice();
    if (!showAll) rows = rows.filter(p => p.reg || p.events > 0);

    /* Default view uses the real ranking (points, wins, cashes, avg finish)
       with genuine ties sharing a rank. Clicking a column header is just a
       sort of that column and shows plain row numbers. */
    let ranked;
    if (sortKey === "points") {
      ranked = BPL.rankPlayers(rows);
    } else {
      ranked = rows.slice().sort((a, b) =>
        sortKey === "avgPlace"
          ? (a.avgPlace || 999) - (b.avgPlace || 999)
          : (b[sortKey] - a[sortKey]) || (b.points - a.points) || a.name.localeCompare(b.name)
      ).map((p, i) => Object.assign({}, p, { rank: i + 1, tied: false }));
    }

    /* Leader is only unambiguous if nobody is tied with them. */
    const lead = ranked[0];
    document.getElementById("sLeader").textContent =
      !hasGames || !lead ? "—" : (lead.tied ? "Tied" : lead.name);

    document.getElementById("tbody").innerHTML = ranked.map((p, i) =>
      '<tr><td class="num">' + (p.tied ? "T" + p.rank : p.rank) + '</td>' +
      '<td><div class="pname">' + UI.avatar(p, "sm") +
        '<span><b>' + UI.esc(p.name) + '</b>' +
        '<small>' + UI.esc(p.fullName || "") + '</small></span></div></td>' +
      '<td class="num"><b>' + BPL.chips(p.points) + '</b></td>' +
      '<td class="num">' + p.events + '</td>' +
      '<td class="num">' + p.wins + '</td>' +
      '<td class="num">' + p.cashes + '</td>' +
      '<td class="num">' + (p.avgPlace ? p.avgPlace.toFixed(1) : "—") + '</td></tr>').join("");

    document.getElementById("btnToggle").textContent =
      showAll ? "Regulars only" : "Show everyone (" + agg.players.length + ")";

    /* -------- Game history, newest first -------- */
    const games = agg.games.slice().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    document.getElementById("gamesHint").textContent = games.length + " recorded";
    document.getElementById("gamesList").innerHTML = games.map(g => {
      const top = (g.finish || []).slice(0, 3);
      return '<details class="gamecard"><summary>' +
        '<span class="gdate">' + BPL.fmtShort(g.date) + '</span>' +
        '<span class="gbody"><strong>' + UI.esc(g.winner || "—") + ' takes it</strong>' +
        '<small>' + g.field + ' players · ' + BPL.money(g.pot) + ' pot' +
        (g.rebuys ? ' · ' + g.rebuys + ' rebuys' : '') + '</small></span>' +
        '<span class="tag done">' + UI.esc(g.label || "Game") + '</span></summary>' +
        '<div class="tbl-scroll"><table class="tbl">' +
        '<thead><tr><th>#</th><th>Player</th><th>Pts</th><th>$</th></tr></thead><tbody>' +
        (g.finish || []).map(r =>
          '<tr><td class="num">' + r.place + '</td><td>' + UI.esc(r.name) +
          (r.rebuys ? ' <span class="tiny muted">+' + r.rebuys + 'r</span>' : '') + '</td>' +
          '<td class="num">' + BPL.chips(r.points) + '</td>' +
          '<td class="num">' + (r.winnings ? BPL.money(r.winnings) : "—") + '</td></tr>').join("") +
        '</tbody></table></div></details>';
    }).join("");
  }

  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.style.cursor = "pointer";
    th.title = "Sort by this column";
    th.addEventListener("click", () => { sortKey = th.dataset.sort; render(); });
  });

  document.getElementById("btnToggle").addEventListener("click", () => { showAll = !showAll; render(); });

  DB.on("results", v => { agg = BPL.aggregate(v || {}); render(); });
})();
</script>
</body>
</html>
