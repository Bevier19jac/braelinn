<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ===================================================================
     PUBLIC IDENTITY
     Every page shares ONE title, description and share image on purpose.
     Link scrapers (iMessage, WhatsApp, Slack) don't run JavaScript and
     read only these static tags — so whichever page gets shared, the
     preview says "Braelinn Poker League", never "Schedule — ...".
     =================================================================== -->
<title>Braelinn Poker League</title>
<meta name="description" content="Season standings, RSVP, schedule, seat draw, and game-night hub for the Braelinn Poker League.">
<link rel="canonical" href="https://bevier19jac.github.io/braelinn/">

<meta property="og:site_name" content="Braelinn Poker League">
<meta property="og:type" content="website">
<meta property="og:title" content="Braelinn Poker League">
<meta property="og:description" content="Season standings, RSVP, schedule, seat draw, and game-night hub for the Braelinn Poker League.">
<meta property="og:url" content="https://bevier19jac.github.io/braelinn/">
<meta property="og:image" content="https://bevier19jac.github.io/braelinn/social-card.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Braelinn Poker League — Season 7, Peachtree City GA">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Braelinn Poker League">
<meta name="twitter:description" content="Season standings, RSVP, schedule, seat draw, and game-night hub for the Braelinn Poker League.">
<meta name="twitter:image" content="https://bevier19jac.github.io/braelinn/social-card.png?v=2">

<!-- ===================================================================
     INSTALLED-APP BEHAVIOUR
     apple-touch-icon is what stops iOS screenshotting the page and using
     that as the home-screen icon. apple-mobile-web-app-title stops iOS
     labelling the icon from <title>.
     =================================================================== -->
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#06120d">
<meta name="color-scheme" content="dark">

<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Braelinn Poker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=17">
</head>
<body>

<div id="nav"></div>

<div class="wrap">
  <header class="hero" style="padding-bottom:20px">
    <p class="hero-eyebrow" id="eyebrow">Season 7</p>
    <h1>Players</h1>
    <p class="hero-sub" id="sub"></p>
  </header>

  <section>
    <input class="inp mb" id="filter" type="search" placeholder="Find a player…" aria-label="Find a player">
    <div class="roster" id="roster"></div>
  </section>
</div>

<div id="footer"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js?v=17"></script>
<script src="data.js?v=17"></script>
<script src="app-core.js?v=17"></script>
<script src="fx.js?v=17"></script>
<script>
(function () {
  "use strict";
  UI.mount("players.html");
  document.getElementById("eyebrow").textContent = "Season " + LEAGUE.season;

  let agg = null, q = "";

  function render() {
    const byName = {};
    if (agg) agg.players.forEach(p => { byName[p.name] = p; });

    const list = LEAGUE.standings.slice()
      .sort((a, b) => a.name.localeCompare(b.name))
      .filter(p => !q ||
        p.name.toLowerCase().indexOf(q) !== -1 ||
        (p.fullName || "").toLowerCase().indexOf(q) !== -1);

    document.getElementById("sub").textContent =
      LEAGUE.standings.length + " on the roster";

    document.getElementById("roster").innerHTML = list.map(p => {
      const s = byName[p.name] || { events: 0, points: 0, wins: 0, cashes: 0, avgPlace: 0 };
      const played = s.events > 0;
      return '<div class="rcard">' + UI.avatar(p.name, "md") +
        '<div class="rc-t"><b>' + UI.esc(p.name) + '</b>' +
        '<small>' + UI.esc(p.fullName || "") + '</small>' +
        (p.saying ? '<em>“' + UI.esc(p.saying) + '”</em>' : '') + '</div>' +
        '<div class="rc-s">' + (played
          ? '<span><b>' + BPL.chips(s.points) + '</b>pts</span>' +
            '<span><b>' + s.events + '</b>games</span>' +
            '<span><b>' + s.wins + '</b>wins</span>' +
            '<span><b>' + (s.avgPlace ? s.avgPlace.toFixed(1) : "—") + '</b>avg</span>'
          : '<span class="rc-none">No games yet</span>') +
        '</div></div>';
    }).join("");
  }

  document.getElementById("filter").addEventListener("input", e => {
    q = e.target.value.trim().toLowerCase(); render();
  });

  DB.on("results", v => { agg = BPL.aggregate(v || {}); render(); });
  render();
})();
</script>
</body>
</html>
